[package]
name = "wspr"
version = "0.11.1"
edition = "2024"
license = "MIT"
description = "Minimal dictation for Windows and Linux: press a hotkey, speak, the text is pasted."
repository = "https://github.com/TonisOrmisson/wspr"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
arboard = { version = "3.7", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"] }
enigo = "0.6"
global-hotkey = "0.10"
open = "5"
ureq = "3"
# The overlay is moved and styled through the native window eframe already creates.
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# API keys in the desktop keyring (Secret Service), like DPAPI on Windows.
keyring = "4"
# KSNI talks to the tray over D-Bus on its own thread, so no GTK event loop is needed.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# Wayland: the RemoteDesktop portal (already in the build through the tray).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[build-dependencies]
embed-resource = "3"
