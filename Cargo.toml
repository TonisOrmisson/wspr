[package]
name = "wspr"
version = "0.9.1"
edition = "2024"
license = "MIT"
description = "Minimal Windows dictation: press a hotkey, speak, OpenAI transcribes, text is pasted."
repository = "https://github.com/TonisOrmisson/wspr"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.7", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
enigo = "0.6"
global-hotkey = "0.10"
open = "5"
tray-icon = "0.26"
ureq = "3"
# The overlay is moved and styled through the native window eframe already creates.
winit = { version = "0.30", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[build-dependencies]
embed-resource = "3"
